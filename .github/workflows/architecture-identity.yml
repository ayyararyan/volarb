name: Architecture identity checks

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'architecture/**'
      - 'docs/workflows/**'
      - 'execution-engine/**'
      - 'environments/execution/**'
      - 'docs/architecture/**'
      - '.github/workflows/architecture-identity.yml'
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'architecture/**'
      - 'docs/workflows/**'
      - 'execution-engine/**'
      - 'environments/execution/**'
      - 'docs/architecture/**'
      - '.github/workflows/architecture-identity.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: node --test architecture/lib/*.test.mjs architecture/*.test.mjs
      - run: node architecture/validate.mjs
