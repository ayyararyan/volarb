name: Execution testbed

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'execution-engine/**'
      - 'compat/javascript/execution-contracts/**'
      - 'execution-testkit/**'
      - 'environments/execution/**'
      - 'services/dhan-chatgpt-mcp/src/**'
      - 'architecture/**'
      - 'docs/workflows/vector-id-registry.json'
      - '.github/workflows/execution-testbed.yml'

permissions:
  contents: read

jobs:
  deterministic-testbed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s execution-engine/tests -p 'test_*.py' -v
      - run: node --test execution-testkit/test/*.test.mjs
      - run: node --test architecture/lib/*.test.mjs architecture/*.test.mjs
      - run: node architecture/validate.mjs
