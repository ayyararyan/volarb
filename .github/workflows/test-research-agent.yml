name: Butterfly Research Laboratory
on:
  push:
    paths: ['VERSION', 'agent/**', '.github/workflows/test-research-agent.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-agent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research-tests:
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.29'
          python-version: '3.12.13'
          enable-cache: false
      - name: Configure private runtime outside checkout
        run: |
          echo "BUTTERFLY_LAB_HOME=$RUNNER_TEMP/butterfly-lab" >> "$GITHUB_ENV"
          uv venv --python 3.12.13 "$RUNNER_TEMP/lab-env"
          echo "$RUNNER_TEMP/lab-env/bin" >> "$GITHUB_PATH"
      - run: uv pip sync --python "$RUNNER_TEMP/lab-env/bin/python" --require-hashes requirements.lock
      - run: uv pip install --python "$RUNNER_TEMP/lab-env/bin/python" --no-deps .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --no-incremental --config-file pyproject.toml
      - run: pytest -q
      - run: butterfly-lab config check
      - run: butterfly-lab config show
      - run: butterfly-lab doctor
      - run: butterfly-lab demo --kind all > "${{ runner.temp }}/demo.json"
      - run: python examples/check_demo.py "${{ runner.temp }}/demo.json"
      - run: python examples/check_generated.py
