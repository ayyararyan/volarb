name: Package Butterfly Skill

on:
  push:
    paths:
      - 'skill/butterfly-market-outlook/**'
      - '.github/skill-tools/**'
      - '.github/workflows/package-butterfly-skill.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Run overnight regression tests
        run: python skill/butterfly-market-outlook/tests/test_v21_overnight.py
      - name: Run regime regression tests
        run: python skill/butterfly-market-outlook/tests/test_v22_regime.py
      - name: Validate and package skill
        run: python .github/skill-tools/package_skill.py skill/butterfly-market-outlook dist
      - name: Upload skill.zip
        uses: actions/upload-artifact@v4
        with:
          name: butterfly-market-outlook-skill
          path: dist/skill.zip
          if-no-files-found: error
          retention-days: 30
