name: Package Butterfly Skills
on:
  push:
    paths: ['VERSION', 'LICENSE', 'tests/test_skill_packaging.py', 'requirements*.lock', 'skill/**', '.github/skill-tools/**', '.github/workflows/package-butterfly-skill.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Skill licensing and fail-closed packaging regressions
        run: python -B -m unittest discover -s tests -p 'test_skill_packaging.py' -v
      - name: Controller, overnight and regime regressions
        run: python -m pytest -q skill/butterfly-market-outlook/tests
      - name: RV fixture checks
        run: python .github/skill-tools/check_rv_fixtures.py
      - name: Validate and package all skills
        run: |
          for skill in butterfly-market-outlook intraday-realized-volatility-forecast market-news-signal-filter; do
            python .github/skill-tools/package_skill.py "skill/$skill" "dist/$skill"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: volarb-skills
          path: dist/*/skill.zip
          if-no-files-found: error
          retention-days: 30
