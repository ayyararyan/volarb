name: Offline eSSVI dashboard HAR tests
on:
  push:
    paths: ['VERSION', 'services/essvi-dashboard/**', '.github/workflows/test-essvi-dashboard.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  har-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/essvi-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/essvi-dashboard/requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest -v test_har.py
