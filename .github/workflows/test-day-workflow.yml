name: Test Shadow Day Workflow
on:
  push:
    paths: ['VERSION', 'requirements*.lock', 'services/day-workflow/**', 'skill/butterfly-market-outlook/**', 'skill/intraday-realized-volatility-forecast/**', '.github/workflows/test-day-workflow.yml']
  pull_request:
    paths: ['VERSION', 'requirements*.lock', 'services/day-workflow/**', 'skill/butterfly-market-outlook/**', 'skill/intraday-realized-volatility-forecast/**', '.github/workflows/test-day-workflow.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Synthetic lifecycle and failure tests (no credentials or broker calls)
        run: python -B -m unittest discover -s services/day-workflow -p 'test_*.py' -v
