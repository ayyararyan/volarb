name: Test Dhan MCP
on:
  push:
    paths: ['VERSION', 'services/dhan-chatgpt-mcp/**', 'execution-engine/**', '.github/workflows/test-dhan-mcp.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dhan-provider:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dhan-chatgpt-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: services/dhan-chatgpt-mcp/package-lock.json
      - run: npm install --global npm@11.17.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify repository-root Docker build and shared contract imports
        working-directory: .
        run: docker build -f services/dhan-chatgpt-mcp/Dockerfile -t volarb-dhan-ci .
