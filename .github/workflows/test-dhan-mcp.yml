name: Test Dhan MCP
on:
  push:
    paths: ['VERSION', 'services/dhan-chatgpt-mcp/**', 'execution-engine/**', '.github/workflows/test-dhan-mcp.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dhan-provider:
    runs-on: [self-hosted, Linux, X64, aryan-mac-linux]
    defaults:
      run:
        working-directory: services/dhan-chatgpt-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: services/dhan-chatgpt-mcp/package-lock.json
      - run: npm install --global npm@11.17.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify repository-root Docker build and shared contract imports
        working-directory: .
        run: |
          test -n "$BUILDKIT_HOST"
          test ! -e /var/run/docker.sock
          buildctl --addr "$BUILDKIT_HOST" build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=services/dhan-chatgpt-mcp \
            --opt filename=Dockerfile \
            --opt platform=linux/amd64 \
            --opt "build-arg:http_proxy=$http_proxy" \
            --opt "build-arg:https_proxy=$https_proxy" \
            --output "type=oci,dest=$RUNNER_TEMP/volarb-dhan-ci.tar"
          test -s "$RUNNER_TEMP/volarb-dhan-ci.tar"
