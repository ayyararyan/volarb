name: Repository Housekeeping

on:
  schedule:
    - cron: '17 3 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-housekeeping
  cancel-in-progress: false

jobs:
  housekeeping:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Run conservative housekeeping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import re
          import shutil

          root = Path(".")
          policy_path = root / ".github" / "housekeeping-policy.json"
          policy = json.loads(policy_path.read_text(encoding="utf-8"))
          allowed_root = set(policy.get("allowed_root_entries", []))
          allowed_root.update({".git", ".github", ".gitignore"})

          safe_dir_names = {
              "__pycache__",
              ".pytest_cache",
              ".mypy_cache",
              ".ruff_cache",
              ".ipynb_checkpoints",
          }
          safe_file_names = {".DS_Store", "Thumbs.db", "desktop.ini"}
          safe_suffixes = {".pyc", ".pyo", ".swp", ".swo"}

          removed = []
          candidates = sorted(
              [p for p in root.rglob("*") if ".git" not in p.parts],
              key=lambda p: len(p.parts),
              reverse=True,
          )

          for path in candidates:
              if not path.exists():
                  continue
              if path.is_dir() and path.name in safe_dir_names:
                  removed.append(str(path))
                  shutil.rmtree(path)
              elif path.is_file():
                  if (
                      path.name in safe_file_names
                      or path.suffix.lower() in safe_suffixes
                      or path.name.endswith("~")
                  ):
                      removed.append(str(path))
                      path.unlink()

          ignore_patterns = [
              ".DS_Store",
              "Thumbs.db",
              "desktop.ini",
              "__pycache__/",
              "*.py[cod]",
              ".pytest_cache/",
              ".mypy_cache/",
              ".ruff_cache/",
              ".ipynb_checkpoints/",
              "*.swp",
              "*.swo",
              "*~",
          ]
          gitignore = root / ".gitignore"
          existing = gitignore.read_text(encoding="utf-8") if gitignore.exists() else ""
          lines = existing.splitlines()
          missing = [p for p in ignore_patterns if p not in lines]
          if missing:
              prefix = "" if not existing or existing.endswith("\n") else "\n"
              block = "# Repository housekeeping\n" + "\n".join(missing) + "\n"
              gitignore.write_text(existing + prefix + block, encoding="utf-8")

          actual_root = {p.name for p in root.iterdir()}
          unclassified = sorted(actual_root - allowed_root)

          suspicious_rx = re.compile(
              r"(\(\d+\)|\bcopy\b|final[-_ ]?final|(?:^|[-_ ])old(?:[-_. ]|$)|\.bak$)",
              re.IGNORECASE,
          )
          suspicious = []
          for path in root.rglob("*"):
              if ".git" in path.parts or ".github" in path.parts:
                  continue
              if suspicious_rx.search(path.name):
                  suspicious.append(str(path))

          hashes = {}
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.parts[:2] == (".github", "workflows"):
                  continue
              try:
                  size = path.stat().st_size
              except OSError:
                  continue
              if size == 0 or size > 20 * 1024 * 1024:
                  continue
              h = hashlib.sha256()
              with path.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              hashes.setdefault((h.hexdigest(), size), []).append(str(path))

          duplicate_groups = [
              paths for paths in hashes.values() if len(paths) > 1
          ]
          duplicate_groups.sort(key=lambda g: (-len(g), g[0]))

          summary = []
          summary.append("# Repository housekeeping")
          summary.append("")
          summary.append("Mode: **conservative** — substantive files are never auto-moved or auto-deleted.")
          summary.append("")
          summary.append(f"- Safe junk removed: **{len(removed)}**")
          summary.append(f"- New root entries outside the cleaned baseline: **{len(unclassified)}**")
          summary.append(f"- Suspicious backup/copy-style names: **{len(suspicious)}**")
          summary.append(f"- Exact duplicate-content groups found: **{len(duplicate_groups)}**")
          summary.append("")

          if removed:
              summary.append("## Safe removals")
              summary.extend(f"- `{p}`" for p in removed[:50])
              summary.append("")

          if unclassified:
              summary.append("## New root entries to classify")
              summary.append("These are reported only; the workflow does not move them.")
              summary.extend(f"- `{p}`" for p in unclassified[:50])
              summary.append("")

          if suspicious:
              summary.append("## Naming candidates for human review")
              summary.extend(f"- `{p}`" for p in suspicious[:50])
              summary.append("")

          if duplicate_groups:
              summary.append("## Exact duplicate-content candidates")
              summary.append("Duplicates are reported only; none are deleted automatically.")
              for group in duplicate_groups[:20]:
                  summary.append("- " + ", ".join(f"`{p}`" for p in group))
              summary.append("")

          summary.append("The baseline and conventions live in `.github/housekeeping-policy.json`.")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(summary) + "\n")
          PY

      - name: Detect safe changes
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge housekeeping into main and delete cleanup branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="automation/repository-housekeeping"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Replace only the automation-owned branch, and only if it has not
          # changed since this run inspected it.
          OLD_HEAD=$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)
          git switch -C "$BRANCH"
          git add -A
          git commit -m "chore: automated repository housekeeping"
          CLEANUP_HEAD=$(git rev-parse HEAD)
          git push --force-with-lease="refs/heads/$BRANCH:$OLD_HEAD" origin "HEAD:refs/heads/$BRANCH"

          # Merge against fresh main. Retry one rejected push to accommodate
          # another writer; conflicts/failures leave the cleanup branch intact.
          MERGED=false
          for ATTEMPT in 1 2; do
            git fetch origin main
            git switch -C housekeeping-integration FETCH_HEAD
            git merge --no-edit "$CLEANUP_HEAD"
            if git push origin HEAD:refs/heads/main; then
              MERGED=true
              break
            fi
          done
          if [ "$MERGED" != true ]; then
            echo "Could not publish cleanup to main; retaining $BRANCH." >&2
            exit 1
          fi

          git fetch origin main
          git merge-base --is-ancestor "$CLEANUP_HEAD" FETCH_HEAD
          # A lease also prevents deleting someone else's newer branch update.
          git push --force-with-lease="refs/heads/$BRANCH:$CLEANUP_HEAD" origin ":refs/heads/$BRANCH"
          echo "Cleanup merged into main; $BRANCH deleted." >> "$GITHUB_STEP_SUMMARY"
