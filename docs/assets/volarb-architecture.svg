<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title description">
<title id="title">Volarb: one engine, injected dependencies</title>
<desc id="description">Architecture design target. Strategy enters through an optional strategy execution adapter. Execution Engine contracts exist; its complete pipeline is in development. The Broker Execution Port connects simulated and Dhan providers. The deterministic testbed injects runtime dependencies.</desc>
<!-- Editable source artwork. Fixed high-contrast palette works on light and dark GitHub pages. -->
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .label { fill: #f0f5fb; font-size: 25px; font-weight: 600; }
  .body { fill: #becbdb; font-size: 18px; }
  .eyebrow { fill: #a9bed3; font-size: 16px; font-weight: 600; letter-spacing: 1.5px; }
  .edge { fill: none; stroke: #809bb7; stroke-width: 2; marker-end: url(#arrow); }
  .inject { fill: none; stroke: #67dcc6; stroke-width: 2; marker-end: url(#teal-arrow); }
</style>
