<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="706" viewBox="0 0 1000 706" role="img" aria-labelledby="title description">
  <title id="title">VolArb architecture: one engine, clear boundaries</title>
  <desc id="description">Strategy policy stays upstream. VolArb or another strategy connects through an optional Strategy Execution Adapter to the reusable Execution Engine. The Execution Testbed injects deterministic runtime dependencies into that same engine. The Broker Execution Port is the shared interface for the Dhan Provider, simulated broker and future providers. Contracts, the provider and test infrastructure are implemented; the complete generic engine pipeline is in development.</desc>
  <!-- Editable vector source. Fixed, high-contrast panel is legible on either GitHub theme. -->
  <defs>
    <marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#66748b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="test-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#087f8c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .ink { fill: #172544; }
    .muted { fill: #536278; }
    .eyebrow { font-size: 14px; font-weight: 650; letter-spacing: 1.8px; }
    .label { font-size: 26px; font-weight: 650; }
    .detail { font-size: 18px; }
    .flow { fill: none; stroke: #66748b; stroke-width: 1.7; marker-end: url(#flow-arrow); }
    .test-flow { fill: none; stroke: #087f8c; stroke-width: 1.8; marker-end: url(#test-arrow); }
  </style>
  <rect x=".5" y=".5" width="999" height="705" rx="12" fill="#fbfcfe" stroke="#dce3ec"/>
  <text x="40" y="42" class="eyebrow muted">VOLARB / EXECUTION ARCHITECTURE</text>
  <text x="40" y="86" class="ink" font-size="36" font-weight="650" letter-spacing="-.8">One engine. Clear boundaries.</text>
  <path d="M40 112 H960" fill="none" stroke="#dce3ec"/>

  <!-- Directed relationships are drawn behind the content. -->
  <path class="flow" d="M460 169 H566"/>
  <path class="flow" d="M758 210 V232 H448 V258"/>
  <path class="test-flow" d="M708 331 H664"/>
  <path class="flow" d="M448 398 V432"/>
  <path d="M448 482 V509 H338 M448 509 H600" fill="none" stroke="#66748b" stroke-width="1.7"/>
  <path class="flow" d="M338 509 V532"/>
  <path class="flow" d="M600 509 V532"/>
  <path class="flow" d="M600 509 H874 V532" stroke-dasharray="4 5"/>

  <!-- Ownership labels form a quiet editorial rail, not another node hierarchy. -->
  <text x="40" y="162" class="eyebrow muted">01 / STRATEGY</text>
  <text x="40" y="190" class="detail muted">Upstream policy</text>
  <text x="40" y="304" class="eyebrow muted">02 / EXECUTION</text>
  <text x="40" y="332" class="detail muted">Reusable core</text>
  <text x="40" y="551" class="eyebrow muted">03 / PROVIDERS</text>
  <text x="40" y="579" class="detail muted">Broker mechanics</text>

  <!-- Strategy semantics do not enter the generic execution core. -->
  <text x="232" y="172" class="label ink">VolArb Strategy</text>
  <text x="232" y="201" class="detail muted">or another strategy</text>
  <text x="590" y="159" class="ink" font-size="25" font-weight="650">Strategy Execution</text>
  <text x="590" y="190" class="ink" font-size="25" font-weight="650">Adapter</text>
  <text x="696" y="189" class="detail muted">optional</text>

  <!-- Only the reusable core receives the dominant visual weight. -->
  <rect x="232" y="258" width="432" height="140" rx="6" fill="#172544"/>
  <text x="260" y="312" fill="#ffffff" font-size="32" font-weight="650" letter-spacing="-.4">Execution Engine</text>
  <text x="260" y="348" fill="#d0dced" font-size="21">Strategy-agnostic execution</text>

  <rect x="708" y="258" width="252" height="140" rx="6" fill="#e8f4f3"/>
  <path d="M708 282 V374" fill="none" stroke="#087f8c" stroke-width="3"/>
  <text x="732" y="305" fill="#11646e" font-size="24" font-weight="650">Execution Testbed</text>
  <text x="732" y="341" fill="#2b6470" font-size="17">Time · seeds · faults</text>
  <text x="732" y="369" fill="#2b6470" font-size="17">Injected dependencies</text>

  <!-- The port is an interface bar, not an additional policy subsystem. -->
  <rect x="232" y="432" width="432" height="50" fill="#e9eef6"/>
  <text x="448" y="465" class="ink" font-size="26" font-weight="600" text-anchor="middle">Broker Execution Port</text>

  <text x="232" y="564" class="label ink">Dhan Provider</text>
  <text x="232" y="592" class="detail muted">Broker integration</text>
  <text x="496" y="564" class="label ink">Simulated broker</text>
  <text x="496" y="592" class="detail muted">Deterministic tests</text>
  <text x="800" y="562" class="ink" font-size="24" font-weight="600">Future brokers</text>
  <text x="800" y="592" class="detail muted">Same interface</text>

  <!-- Implementation status is stated once, separately from conceptual topology. -->
  <path d="M40 619 H960" fill="none" stroke="#dce3ec"/>
  <text x="40" y="647" class="muted" font-size="18"><tspan fill="#172544" font-weight="650">Implemented</tspan><tspan dx="8">Contracts, Dhan Provider and deterministic test infrastructure.</tspan></text>
  <text x="40" y="673" class="muted" font-size="18"><tspan fill="#172544" font-weight="650">In development</tspan><tspan dx="8">Complete generic Execution Engine pipeline.</tspan></text>
</svg>
