<svg xmlns="http://www.w3.org/2000/svg" width="440" height="945" viewBox="0 0 440 945" role="img" aria-labelledby="title description">
  <title id="title">VolArb architecture: one engine, clear boundaries</title>
  <desc id="description">Mobile architecture diagram. VolArb or another strategy connects through an optional Strategy Execution Adapter to the reusable Execution Engine. The Execution Testbed injects deterministic runtime dependencies into the same core. The Broker Execution Port is implemented by the Dhan Provider and simulated broker and can support future providers. Contracts, Dhan and test infrastructure are implemented; the complete generic engine pipeline is in development.</desc>
  <!-- Independently composed mobile layout; all main labels remain at least 24 px. -->
  <defs>
    <marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#66748b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="test-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#087f8c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .ink { fill: #172544; }
    .muted { fill: #536278; }
    .label { font-size: 24px; font-weight: 650; }
    .detail { font-size: 18px; }
    .flow { fill: none; stroke: #66748b; stroke-width: 1.7; marker-end: url(#flow-arrow); }
    .test-flow { fill: none; stroke: #087f8c; stroke-width: 1.8; marker-end: url(#test-arrow); }
  </style>
  <rect x=".5" y=".5" width="439" height="944" rx="12" fill="#fbfcfe" stroke="#dce3ec"/>
  <text x="24" y="37" class="muted" font-size="13" font-weight="650" letter-spacing="1.5">VOLARB / EXECUTION ARCHITECTURE</text>
  <text x="24" y="82" class="ink" font-size="34" font-weight="650" letter-spacing="-.6">One engine.</text>
  <text x="24" y="122" class="ink" font-size="34" font-weight="650" letter-spacing="-.6">Clear boundaries.</text>
  <path d="M24 148 H416" fill="none" stroke="#dce3ec"/>

  <!-- Two local input lanes avoid a perimeter return path on small screens. -->
  <path class="flow" d="M116 265 V291"/>
  <path class="flow" d="M116 406 V455"/>
  <path class="test-flow" d="M332 406 V455"/>
  <path class="flow" d="M220 573 V614"/>
  <path d="M220 674 V704 H114 M220 704 H328" fill="none" stroke="#66748b" stroke-width="1.7"/>
  <path class="flow" d="M114 704 V733"/>
  <path class="flow" d="M328 704 V733"/>

  <text x="24" y="195" class="label ink">VolArb Strategy</text>
  <text x="24" y="224" class="detail muted">or another strategy</text>
  <text x="24" y="319" class="label ink">Strategy</text>
  <text x="24" y="350" class="label ink">Execution Adapter</text>
  <text x="24" y="383" class="detail muted">optional</text>

  <rect x="250" y="173" width="166" height="233" rx="6" fill="#e8f4f3"/>
  <path d="M250 197 V382" fill="none" stroke="#087f8c" stroke-width="3"/>
  <text x="274" y="220" fill="#11646e" font-size="24" font-weight="650">Execution</text>
  <text x="274" y="251" fill="#11646e" font-size="24" font-weight="650">Testbed</text>
  <text x="274" y="287" fill="#2b6470" font-size="18">Virtual time</text>
  <text x="274" y="317" fill="#2b6470" font-size="18">Seeded runs</text>
  <text x="274" y="347" fill="#2b6470" font-size="18">Fault injection</text>
  <text x="274" y="377" fill="#2b6470" font-size="18">Invariants</text>
  <rect x="69" y="420" width="94" height="21" fill="#fbfcfe"/>
  <text x="116" y="436" class="detail muted" text-anchor="middle">Intent</text>
  <rect x="269" y="420" width="126" height="21" fill="#fbfcfe"/>
  <text x="332" y="436" fill="#11646e" font-size="18" text-anchor="middle">Runtime ports</text>

  <rect x="24" y="455" width="392" height="118" rx="6" fill="#172544"/>
  <text x="48" y="504" fill="#ffffff" font-size="29" font-weight="650" letter-spacing="-.3">Execution Engine</text>
  <text x="48" y="541" fill="#d0dced" font-size="21">Strategy-agnostic core</text>
  <rect x="24" y="614" width="392" height="60" fill="#e9eef6"/>
  <text x="220" y="653" class="ink" font-size="25" font-weight="600" text-anchor="middle">Broker Execution Port</text>

  <text x="114" y="765" class="label ink" text-anchor="middle">Dhan</text>
  <text x="114" y="795" class="label ink" text-anchor="middle">Provider</text>
  <text x="328" y="765" class="label ink" text-anchor="middle">Simulated</text>
  <text x="328" y="795" class="label ink" text-anchor="middle">broker</text>
  <text x="220" y="832" class="detail muted" text-anchor="middle">Future providers extend the same port</text>

  <path d="M24 856 H416" fill="none" stroke="#dce3ec"/>
  <text x="24" y="885" class="muted" font-size="17">Contracts, Dhan + test infrastructure implemented.</text>
  <text x="24" y="913" class="muted" font-size="17">Complete engine pipeline in development.</text>
</svg>
