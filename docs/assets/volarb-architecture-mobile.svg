  .eyebrow { fill: #a9bed3; font-size: 16px; font-weight: 600; letter-spacing: 1.5px; }
  .edge { fill: none; stroke: #809bb7; stroke-width: 2; marker-end: url(#arrow); }
  .inject { fill: none; stroke: #67dcc6; stroke-width: 2; marker-end: url(#teal-arrow); }
</style>
