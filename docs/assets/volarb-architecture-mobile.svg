<svg xmlns="http://www.w3.org/2000/svg" width="440" height="764" viewBox="0 0 440 764" role="img" aria-labelledby="title description">
<title id="title">Volarb: one engine, injected dependencies</title>
<desc id="description">Architecture design target. Strategy enters through an optional strategy execution adapter. Execution Engine contracts exist; its complete pipeline is in development. The Broker Execution Port connects simulated and Dhan providers. The deterministic testbed injects runtime dependencies.</desc>
